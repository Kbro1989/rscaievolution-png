name = "rsc-cloudflare"
main = "worker.js"
pages_build_output_dir = "public"
compatibility_date = "2024-11-28"

# 1. CORE STORAGE
[[kv_namespaces]]
binding = "KV"
id = "f2881801ac59415a86236d0841f27103"  # Hot data: Player saves, Items, NPCs

[[d1_databases]]
binding = "DB"
database_name = "rsc-d1"
database_id = "d021ab5b-ab13-47b8-9287-1aabebfe51df" # Authoritative: Players, Logs

# Asset Storage (Optional)
[[r2_buckets]]
binding = "RSC_ASSETS"
bucket_name = "rsc-assets"
preview_bucket_name = "rsc-assets-preview"

# 2. DURABLE OBJECTS
# Main Game Server (World State)
[[durable_objects.bindings]]
name = "DO_AMERICAS"
class_name = "RSCServerDO"

# Individual Player Sessions
[[durable_objects.bindings]]
name = "PlayerDO"
class_name = "PlayerDO"

# 3. MIGRATIONS
[[migrations]]
tag = "v1"
new_classes = ["RSCServerDO", "PlayerDO"]

# 4. QUEUES (Async Persistence)
[[queues.producers]]
binding = "PLAYER_QUEUE"
queue = "player-save-queue"

[[queues.consumers]]
queue = "player-save-queue"
# processed by this same worker


# 5. ENVIRONMENT CONFIG
[vars]
MEMBERS = "true"
SAFETY_REQ_CAP = "90000"
FEATURE_BACKUPS = "true"

[env.production]
name = "rsc-authentic-prod"

[env.demo]
name = "rsc-authentic-demo"

# 6. BUILD RULES
[[rules]]
type = "Data"
globs = ["**/*.jag", "**/*.mem"]
fallthrough = false
